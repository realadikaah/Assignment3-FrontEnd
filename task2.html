<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 2 - Bootstrap Grid Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .demo-card {
      background-color: #e9ecef;
      border: 2px solid #0d6efd;
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container my-5">
    <h2 class="text-center mb-4">Task 2: Bootstrap 12-Column Responsive Grid</h2>
    
    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="demo-card">Column 1</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="demo-card">Column 2</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="demo-card">Column 3</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
